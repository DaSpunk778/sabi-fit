<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SABI FIT · Log in</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8F135}a:hover{color:#E2FF7A}
.s{position:relative;box-sizing:border-box;font-family:Manrope,system-ui,sans-serif;color:#F2F3F1;background:#0B0C0E;font-variant-numeric:tabular-nums;font-size:15px;line-height:1.4;overflow:hidden}
.s *{box-sizing:border-box}
.d{font-family:'Barlow Condensed',Manrope,sans-serif;font-weight:700;letter-spacing:.01em;text-transform:uppercase}
.mut{color:#9AA0A6}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9AA0A6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border-radius:16px;border:0;font:800 17px Manrope,sans-serif;background:#C8F135;color:#0B0C0E;text-decoration:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid #2A2E33;background:#15171A;color:#F2F3F1;padding:0;text-decoration:none}
.field{display:flex;flex-direction:column;gap:8px}
.box{display:flex;align-items:center;gap:10px;height:56px;padding:0 6px 0 16px;border-radius:14px;border:1px solid #2A2E33;background:#15171A}
.box input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:#F2F3F1;font:600 16px Manrope,sans-serif;outline:none}
.box input::placeholder{color:#6B7178}
.eye{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:transparent;color:#9AA0A6;padding:0}
.err{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(255,122,122,.1);border:1px solid rgba(255,122,122,.35);color:#FFB3B3;font-size:14px;font-weight:600}
</style>
<style>body{background:#050607}body>div{margin:0 auto}</style>
</head>
<body>
<div class="s" style="width: 390px; height: 844px; display: flex; flex-direction: column; padding: 16px 24px 36px;">
  <header style="display: flex; align-items: center; justify-content: space-between;">
    <a class="ib" href="01-welcome.html" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
    <span class="d" style="font-size: 20px; font-style: italic;">Sabi <span style="color: #C8F135;">Fit</span></span>
    <span style="width: 44px;"></span>
  </header>

  <h1 class="d" style="margin: 32px 0 0; font-size: 48px; line-height: .95;">Welcome<br>back</h1>
  <p class="mut" style="margin: 10px 0 0; font-size: 15px;">Log in to pick up where you stopped.</p>

  <form style="display: flex; flex-direction: column; gap: 16px; margin-top: 28px;">
    <label class="field"><span class="lbl">Email</span><span class="box"><input type="email" autocomplete="email" placeholder="you@example.com"></span></label>
    <label class="field"><span class="lbl">Password</span>
      <span class="box"><input type="password" autocomplete="current-password" placeholder="Your password"><button class="eye" type="button" aria-label="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span>
    </label>
    <a href="03-login.html" style="align-self: flex-end; font-size: 14px; font-weight: 800; text-decoration: none; padding: 6px 0;">Forgot password?</a>
    <div class="err" role="alert"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg><span>Email or password is wrong. Try again.</span></div>
  </form>

  <div style="flex: 1;"></div>

  <a class="btn" href="04-today.html">Log in</a>
  <p style="margin: 18px 0 0; text-align: center; font-size: 15px;" class="mut">New here? <a href="02-signup.html" style="font-weight: 800; text-decoration: none;">Create account</a></p>
</div>
</body>
</html>
