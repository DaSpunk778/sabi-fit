<!doctype html>

<title>SABI FIT · Wrapped 4 · Your split</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
.w{position:relative;box-sizing:border-box;overflow:hidden;font-family:Manrope,system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:15px;line-height:1.4}
.w *{box-sizing:border-box}
.d{font-family:'Barlow Condensed',Manrope,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.005em}
.it{font-style:italic}
.top{position:absolute;left:12px;right:12px;top:12px;z-index:6}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.seg{height:3px;border-radius:3px;background:var(--trk);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--ink)}
.seg.done i{width:100%}
.seg.now i{animation:fill 7s linear forwards}
.hd{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.brand{display:inline-flex;align-items:center;gap:8px;font:800 11px Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.mk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:var(--mk);color:var(--mkc)}
.x{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;color:var(--ink);text-decoration:none;margin-right:-8px}
.tap{position:absolute;top:76px;bottom:0;z-index:5}
.prev{left:0;width:30%}
.next{right:0;width:70%}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes fill{to{width:100%}}
.lane{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:10px}
.lname{font-size:23px;line-height:1;color:#C9CDD1}
.track{position:relative;height:38px;border-radius:10px;background:#121417;overflow:hidden}
.runner{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:10px;background:#2A2E33;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;animation:race 2.6s cubic-bezier(.45,.05,.3,1) .5s forwards}
.runner.win{background:#C8F135}
@keyframes race{0%{width:0}55%{width:var(--m)}100%{width:var(--w)}}
.cnt{font:800 15px Manrope,sans-serif;color:#F2F3F1;opacity:0;animation:pop .3s ease 3.1s forwards}
.win .cnt{color:#0B0C0E}
@keyframes pop{to{opacity:1}}
.flag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;background:#C8F135;color:#0B0C0E;font:800 11px Manrope,sans-serif;letter-spacing:.1em;opacity:0;transform:scale(.4);animation:flag .45s cubic-bezier(.34,1.56,.64,1) 3.2s forwards}
@keyframes flag{to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.w *{animation-duration:1ms!important;animation-delay:0s!important}}
</style>
<style>body{background:#050607}body>div{margin:0 auto}</style>
</head>
