<style>
body{margin:0}
a{color:inherit}

.mk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:var(--mk);color:var(--mkc)}
.x{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;color:var(--ink);text-decoration:none;margin-right:-8px}
.tap{position:absolute;top:76px;bottom:0;z-index:5}
.prev{left:0;width:30%}
.next{right:0;width:70%}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes fill{to{width:100%}}
.odo{display:inline-flex;line-height:1}
.dg{display:inline-block;height:1em;overflow:hidden}
.dg b{display:block;line-height:1em;font-weight:inherit;animation:snap .9s cubic-bezier(.34,1.7,.6,1) 1.5s forwards}
@keyframes snap{to{transform:translateY(-5em)}}
.was{position:relative;display:inline-block}
.was::after{content:'';position:absolute;left:-4px;right:-4px;top:52%;height:5px;background:#0B0C0E;transform:scaleX(0);transform-origin:0 50%;animation:strike .35s ease 1.2s forwards}
@keyframes strike{to{transform:scaleX(1)}}
.stick{position:absolute;right:6px;top:-6px;padding:10px 14px;border-radius:14px;background:#0B0C0E;color:#C8F135;transform:rotate(8deg) scale(0);animation:stick .5s cubic-bezier(.34,1.56,.64,1) 2.4s forwards}
@keyframes stick{to{transform:rotate(8deg) scale(1)}}
.burst{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;border:3px solid #0B0C0E;opacity:0;animation:burst .9s ease-out 2.1s forwards}
@keyframes burst{0%{opacity:.5;transform:scale(.2)}100%{opacity:0;transform:scale(1.2)}}
@media (prefers-reduced-motion: reduce){.w *{animation-duration:1ms!important;animation-delay:0s!important}}
