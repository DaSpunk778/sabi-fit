<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SABI FIT · Add Exercises</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8F135}a:hover{color:#E2FF7A}
.s{position:relative;box-sizing:border-box;font-family:Manrope,system-ui,sans-serif;color:#F2F3F1;background:#0B0C0E;font-variant-numeric:tabular-nums;font-size:15px;line-height:1.4;overflow:hidden}
.s *{box-sizing:border-box}
.d{font-family:'Barlow Condensed',Manrope,sans-serif;font-weight:700;letter-spacing:.01em;text-transform:uppercase}
.card{background:#15171A;border:1px solid #24282D;border-radius:18px}
.mut{color:#9AA0A6}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9AA0A6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border-radius:16px;border:0;font:800 17px Manrope,sans-serif;background:#C8F135;color:#0B0C0E;text-decoration:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid #2A2E33;background:#15171A;color:#F2F3F1;padding:0;text-decoration:none}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;border:1px solid #2A2E33;background:#15171A;color:#C9CDD1;font:700 13px Manrope,sans-serif;white-space:nowrap}
.chip.on{background:#C8F135;color:#0B0C0E;border-color:#C8F135}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:62px;cursor:pointer}
.row + .row{border-top:1px solid #24282D}
.cb{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:0;border-radius:8px;border:2px solid #3A3F45;background:transparent;cursor:pointer;position:relative}
.cb:checked{background:#C8F135;border-color:#C8F135}
.cb:checked::after{content:'';position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #0B0C0E;border-width:0 3px 3px 0;transform:rotate(45deg)}
.in{font:800 11px Manrope,sans-serif;color:#9AA0A6;letter-spacing:.06em}
</style>
<style>body{background:#050607}body>div{margin:0 auto}</style>
</head>
<body>
<div class="s" style="width: 390px; height: 900px;">
  <header style="padding: 16px 20px 8px; display: flex; align-items: center; gap: 12px;">
    <a class="ib" href="05-plan-day.html" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></a>
    <h1 class="d" style="margin: 0; font-size: 32px; line-height: 1;">Add exercises</h1>
  </header>

  <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 12px;">
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 14px; background: #15171A; border: 1px solid #2A2E33;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA0A6" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input aria-label="Search exercises" placeholder="Search exercises" style="flex: 1; border: 0; background: transparent; color: #F2F3F1; font: 600 15px Manrope, sans-serif; outline: none;">
    </label>
    <div style="display: flex; gap: 8px; overflow: hidden;">
      <span class="chip on">Chest</span><span class="chip">Biceps</span><span class="chip">Arms</span><span class="chip">Shoulders</span><span class="chip">Back</span><span class="chip">Legs</span>
    </div>

    <section class="card">
      <label class="row"><input class="cb" type="checkbox" checked disabled><span style="flex: 1;"><b>Push-ups</b><br><span class="mut" style="font-size: 13px;">Bodyweight</span></span><span class="in">IN PLAN</span></label>
      <label class="row"><input class="cb" type="checkbox" checked disabled><span style="flex: 1;"><b>Dumbbell Floor Press</b><br><span class="mut" style="font-size: 13px;">Dumbbell</span></span><span class="in">IN PLAN</span></label>
      <label class="row"><input class="cb" type="checkbox" checked disabled><span style="flex: 1;"><b>Dumbbell Pullover</b><br><span class="mut" style="font-size: 13px;">Dumbbell</span></span><span class="in">IN PLAN</span></label>
      <label class="row"><input class="cb" type="checkbox" checked disabled><span style="flex: 1;"><b>Diamond Push-ups</b><br><span class="mut" style="font-size: 13px;">Bodyweight</span></span><span class="in">IN PLAN</span></label>
      <label class="row"><input class="cb" type="checkbox" checked><span style="flex: 1;"><b>Wide Push-ups</b><br><span class="mut" style="font-size: 13px;">Bodyweight</span></span></label>
      <label class="row"><input class="cb" type="checkbox"><span style="flex: 1;"><b>Dumbbell Fly</b><br><span class="mut" style="font-size: 13px;">Dumbbell</span></span></label>
      <label class="row"><input class="cb" type="checkbox"><span style="flex: 1;"><b>Decline Push-ups</b><br><span class="mut" style="font-size: 13px;">Bodyweight</span></span></label>
      <label class="row"><input class="cb" type="checkbox"><span style="flex: 1;"><b>Bench Press</b><br><span class="mut" style="font-size: 13px;">Barbell</span></span></label>
    </section>

    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 0; background: transparent; color: #C8F135; font: 800 15px Manrope, sans-serif;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>Create your own exercise</button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 32px; background: #0B0C0E; border-top: 1px solid #1F2226;">
    <a class="btn" href="05-plan-day.html" style="width: 100%;">Add 1 exercise</a>
  </div>
</div>
</body>
</html>
