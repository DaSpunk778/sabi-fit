<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SABI FIT · Add Exercises</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8F135}a:hover{color:#E2FF7A}
.s{position:relative;box-sizing:border-box;font-family:Manrope,system-ui,sans-serif;color:#F2F3F1;background:#0B0C0E;font-variant-numeric:tabular-nums;font-size:15px;line-height:1.4;overflow:hidden}
.s *{box-sizing:border-box}
.d{font-family:'Barlow Condensed',Manrope,sans-serif;font-weight:700;letter-spacing:.01em;text-transform:uppercase}
.card{background:#15171A;border:1px solid #24282D;border-radius:18px}
.mut{color:#9AA0A6}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9AA0A6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border-radius:16px;border:0;font:800 17px Manrope,sans-serif;background:#C8F135;color:#0B0C0E;text-decoration:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid #2A2E33;background:#15171A;color:#F2F3F1;padding:0;text-decoration:none}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;border:1px solid #2A2E33;background:#15171A;color:#C9CDD1;font:700 13px Manrope,sans-serif;white-space:nowrap}
.chip.on{background:#C8F135;color:#0B0C0E;border-color:#C8F135}
.row{display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:62px;cursor:pointer}
.row + .row{border-top:1px solid #24282D}
.cb{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:0;border-radius:8px;border:2px solid #3A3F45;background:transparent;cursor:pointer;position:relative}
.cb:checked{background:#C8F135;border-color:#C8F135}
.cb:checked::after{content:'';position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #0B0C0E;border-width:0 3px 3px 0;transform:rotate(45deg)}
.in{font:800 11px Manrope,sans-serif;color:#9AA0A6;letter-spacing:.06em}
.ex{flex:none;display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:12px;background:#0F1113;border:1px solid #24282D}
.ex svg{display:block;overflow:visible}
.ex .fig{fill:none;stroke:#C8F135;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ex .flr{stroke:#2A2E33;stroke-width:2;stroke-linecap:round}
.ex .hd,.ex .db{fill:#C8F135;stroke:none}
.ex .mv{transform-box:view-box;animation-duration:1.4s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.pu-body{transform-origin:40px 37px;animation-name:puBody}
.pu-arm{transform-origin:14px 37px;animation-name:puArm}
@keyframes puBody{to{transform:rotate(-12deg)}}
@keyframes puArm{to{transform:scaleY(.49)}}
.pr-arm{transform-origin:22px 36px;animation-name:prArm}
.pr-db{animation-name:prDb}
@keyframes prArm{to{transform:scaleY(.5)}}
@keyframes prDb{to{transform:translateY(10px)}}
.pv-arm{transform-origin:22px 36px;animation-name:pvArm}
@keyframes pvArm{to{transform:rotate(-62deg)}}
.fl-l{transform-origin:17px 26px;animation-name:flL}
.fl-r{transform-origin:31px 26px;animation-name:flR}
@keyframes flL{to{transform:rotate(-58deg)}}
@keyframes flR{to{transform:rotate(58deg)}}
@media (prefers-reduced-motion: reduce){.ex .mv{animation:none}}
</style>
<style>body{background:#050607}body>div{margin:0 auto}</style>
</head>
<body>
<div class="s" style="width: 390px; height: 900px;">
  <header style="padding: 16px 20px 8px; display: flex; align-items: center; gap: 12px;">
    <a class="ib" href="05-plan-day.html" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></a>
    <h1 class="d" style="margin: 0; font-size: 32px; line-height: 1;">Add exercises</h1>
  </header>

  <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 12px;">
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 14px; background: #15171A; border: 1px solid #2A2E33;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA0A6" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input aria-label="Search exercises" placeholder="Search exercises" style="flex: 1; border: 0; background: transparent; color: #F2F3F1; font: 600 15px Manrope, sans-serif; outline: none;">
    </label>
    <div style="display: flex; gap: 8px; overflow: hidden;">
      <span class="chip on">Chest</span><span class="chip">Biceps</span><span class="chip">Arms</span><span class="chip">Shoulders</span><span class="chip">Back</span><span class="chip">Legs</span>
    </div>

    <section class="card">
      <label class="row"><input class="cb" type="checkbox" checked disabled><span class="ex" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 48 48"><line class="flr" x1="4" y1="39" x2="46" y2="39"></line><g class="mv pu-body"><line class="fig" x1="40" y1="37" x2="14" y2="26"></line><circle class="hd" cx="9" cy="23" r="3.5"></circle></g><line class="fig mv pu-arm" x1="14" y1="37" x2="14" y2="26"></line></svg></span><span style="flex: 1;"><b>Push-ups</b><br><span class="mut" style="font-size: 13px;">Bodyweight</span></span><span class="in">IN PLAN</span></label>
      <label class="row"><input class="cb" type="checkbox" checked disabled><span class="ex" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 48 48"><line class="flr" x1="4" y1="40" x2="46" y2="40"></line><line class="fig" x1="12" y1="36" x2="40" y2="36"></line><line class="fig" x1="40" y1="36" x2="44" y2="40"></line><circle class="hd" cx="7" cy="35" r="3.5"></circle><line class="fig mv pr-arm" x1="22" y1="36" x2="22" y2="16"></line><rect class="db mv pr-db" x="15" y="12" width="14" height="4" rx="2"></rect></svg></span><span style="flex: 1;"><b>Dumbbell Floor Press</b><br><span class="mut" style="font-size: 13px;">Dumbbell</span></span><span class="in">IN PLAN</span></label>
      <label class="row"><input class="cb" type="checkbox" checked disabled><span class="ex" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 48 48"><line class="flr" x1="4" y1="40" x2="46" y2="40"></line><line class="fig" x1="12" y1="36" x2="40" y2="36"></line><line class="fig" x1="40" y1="36" x2="44" y2="40"></line><circle class="hd" cx="7" cy="35" r="3.5"></circle><g class="mv pv-arm"><line class="fig" x1="22" y1="36" x2="22" y2="16"></line><rect class="db" x="15" y="12" width="14" height="4" rx="2"></rect></g></svg></span><span style="flex: 1;"><b>Dumbbell Pullover</b><br><span class="mut" style="font-size: 13px;">Dumbbell</span></span><span class="in">IN PLAN</span></label>
      <label class="row"><input class="cb" type="checkbox" checked disabled><span class="ex" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 48 48"><line class="flr" x1="4" y1="39" x2="46" y2="39"></line><g class="mv pu-body"><line class="fig" x1="40" y1="37" x2="14" y2="26"></line><circle class="hd" cx="9" cy="23" r="3.5"></circle></g><line class="fig mv pu-arm" x1="14" y1="37" x2="14" y2="26"></line></svg></span><span style="flex: 1;"><b>Diamond Push-ups</b><br><span class="mut" style="font-size: 13px;">Bodyweight</span></span><span class="in">IN PLAN</span></label>
      <label class="row"><input class="cb" type="checkbox" checked><span class="ex" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 48 48"><line class="flr" x1="4" y1="39" x2="46" y2="39"></line><g class="mv pu-body"><line class="fig" x1="40" y1="37" x2="14" y2="26"></line><circle class="hd" cx="9" cy="23" r="3.5"></circle></g><line class="fig mv pu-arm" x1="14" y1="37" x2="14" y2="26"></line></svg></span><span style="flex: 1;"><b>Wide Push-ups</b><br><span class="mut" style="font-size: 13px;">Bodyweight</span></span></label>
      <label class="row"><input class="cb" type="checkbox"><span class="ex" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 48 48"><circle class="hd" cx="24" cy="17" r="4"></circle><line class="fig" x1="24" y1="25" x2="24" y2="42"></line><line class="fig" x1="17" y1="26" x2="31" y2="26"></line><g class="mv fl-l"><line class="fig" x1="17" y1="26" x2="20" y2="10"></line><circle class="db" cx="20" cy="9" r="3"></circle></g><g class="mv fl-r"><line class="fig" x1="31" y1="26" x2="28" y2="10"></line><circle class="db" cx="28" cy="9" r="3"></circle></g></svg></span><span style="flex: 1;"><b>Dumbbell Fly</b><br><span class="mut" style="font-size: 13px;">Dumbbell</span></span></label>
      <label class="row"><input class="cb" type="checkbox"><span class="ex" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 48 48"><line class="flr" x1="4" y1="39" x2="46" y2="39"></line><g class="mv pu-body"><line class="fig" x1="40" y1="37" x2="14" y2="26"></line><circle class="hd" cx="9" cy="23" r="3.5"></circle></g><line class="fig mv pu-arm" x1="14" y1="37" x2="14" y2="26"></line></svg></span><span style="flex: 1;"><b>Decline Push-ups</b><br><span class="mut" style="font-size: 13px;">Bodyweight</span></span></label>
      <label class="row"><input class="cb" type="checkbox"><span class="ex" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 48 48"><line class="flr" x1="4" y1="40" x2="46" y2="40"></line><line class="fig" x1="12" y1="36" x2="40" y2="36"></line><line class="fig" x1="40" y1="36" x2="44" y2="40"></line><circle class="hd" cx="7" cy="35" r="3.5"></circle><line class="fig mv pr-arm" x1="22" y1="36" x2="22" y2="16"></line><rect class="db mv pr-db" x="15" y="12" width="14" height="4" rx="2"></rect></svg></span><span style="flex: 1;"><b>Bench Press</b><br><span class="mut" style="font-size: 13px;">Barbell</span></span></label>
    </section>

    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 0; background: transparent; color: #C8F135; font: 800 15px Manrope, sans-serif;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>Create your own exercise</button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 32px; background: #0B0C0E; border-top: 1px solid #1F2226;">
    <a class="btn" href="05-plan-day.html" style="width: 100%;">Add 1 exercise</a>
  </div>
</div>
</body>
</html>
