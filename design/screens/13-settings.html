<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SABI FIT · Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8F135}a:hover{color:#E2FF7A}
.s{position:relative;box-sizing:border-box;font-family:Manrope,system-ui,sans-serif;color:#F2F3F1;background:#0B0C0E;font-variant-numeric:tabular-nums;font-size:15px;line-height:1.4;overflow:hidden}
.s *{box-sizing:border-box}
.d{font-family:'Barlow Condensed',Manrope,sans-serif;font-weight:700;letter-spacing:.01em;text-transform:uppercase}
.card{background:#15171A;border:1px solid #24282D;border-radius:18px}
.mut{color:#9AA0A6}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9AA0A6}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid #2A2E33;background:#15171A;color:#F2F3F1;padding:0;text-decoration:none}
.li{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px}
.li + .li{border-top:1px solid #24282D}
.stp{display:flex;align-items:center;gap:4px}
.stp button{width:40px;height:40px;border-radius:10px;border:1px solid #2A2E33;background:#1E2125;color:#F2F3F1;font:800 18px Manrope,sans-serif;padding:0}
.stp b{min-width:52px;text-align:center}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:30px;border-radius:999px;background:#2A2E33;position:relative;margin:0;cursor:pointer}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#F2F3F1}
.sw:checked{background:#C8F135}
.sw:checked::after{left:26px;background:#0B0C0E}
.act{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;min-height:58px;border:0;background:transparent;color:#F2F3F1;font:700 15px Manrope,sans-serif;text-align:left;text-decoration:none}
.act + .act{border-top:1px solid #24282D}
</style>
<style>body{background:#050607}body>div{margin:0 auto}</style>
</head>
<body>
<div class="s" style="width: 390px; height: 900px;">
  <header style="padding: 16px 20px 12px; display: flex; align-items: center; gap: 12px;">
    <a class="ib" href="04-today.html" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
    <h1 class="d" style="margin: 0; font-size: 34px; line-height: 1;">Settings</h1>
  </header>

  <div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 10px;">
    <h2 class="lbl" style="margin: 8px 0 0;">Account</h2>
    <section class="card" style="padding: 16px; display: flex; align-items: center; gap: 14px;">
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 50%; background: #C8F135; color: #0B0C0E; flex: none;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
      <span style="flex: 1; min-width: 0;"><b style="font-size: 17px;">[Your name]</b><br><span class="mut" style="font-size: 14px;">you@example.com</span></span>
      <button class="ib" type="button" aria-label="Edit name" style="border: 0; background: transparent;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
    </section>

    <h2 class="lbl" style="margin: 8px 0 0;">During a workout</h2>
    <section class="card">
      <div class="li"><span style="flex: 1;">Rest time</span><div class="stp"><button type="button" aria-label="Less rest">−</button><b>1:30</b><button type="button" aria-label="More rest">+</button></div></div>
      <label class="li"><span style="flex: 1;">Sound<br><span class="mut" style="font-size: 13px;">Beep when rest ends</span></span><input class="sw" type="checkbox" role="switch" checked></label>
      <label class="li"><span style="flex: 1;">Vibration</span><input class="sw" type="checkbox" role="switch" checked></label>
    </section>

    <h2 class="lbl" style="margin: 8px 0 0;">Your data</h2>
    <section class="card" style="overflow: hidden;">
      <button class="act" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C8F135" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg><span style="flex: 1;">Download my data (.json)</span></button>
    </section>

    <section class="card" style="overflow: hidden; margin-top: 8px;">
      <a class="act" href="01-welcome.html" style="color: #FF8A8A;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg><span style="flex: 1;">Log out</span></a>
    </section>

    <div class="mut" style="text-align: center; font-size: 12px; font-weight: 700; margin-top: 12px;"><span class="d" style="font-size: 15px; font-style: italic; color: #C9CDD1;">Sabi <span style="color: #C8F135;">Fit</span></span> · v0.1</div>
  </div>
</div>
</body>
</html>
