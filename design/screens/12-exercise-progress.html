<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SABI FIT · Push-ups Progress</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8F135}a:hover{color:#E2FF7A}
.s{position:relative;box-sizing:border-box;font-family:Manrope,system-ui,sans-serif;color:#F2F3F1;background:#0B0C0E;font-variant-numeric:tabular-nums;font-size:15px;line-height:1.4;overflow:hidden}
.s *{box-sizing:border-box}
.d{font-family:'Barlow Condensed',Manrope,sans-serif;font-weight:700;letter-spacing:.01em;text-transform:uppercase}
.card{background:#15171A;border:1px solid #24282D;border-radius:18px}
.mut{color:#9AA0A6}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9AA0A6}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid #2A2E33;background:#15171A;color:#F2F3F1;padding:0;text-decoration:none}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:99px;background:#1E2125;color:#C9CDD1;font:700 12px Manrope,sans-serif}
.bar{height:10px;border-radius:99px;background:#24282D;overflow:hidden}
.bar i{display:block;height:100%;background:#C8F135;border-radius:99px}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px}
.li + .li{border-top:1px solid #24282D}
</style>
<style>body{background:#050607}body>div{margin:0 auto}</style>
</head>
<body>
<div class="s" style="width: 390px; height: 1060px;">
  <header style="padding: 16px 20px 8px; display: flex; align-items: center; gap: 12px;">
    <a class="ib" href="11-progress.html" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
    <span style="flex: 1;"></span>
    <button class="ib" type="button" aria-label="Edit exercise"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
  </header>

  <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 14px;">
    <div>
      <h1 class="d" style="margin: 0; font-size: 48px; line-height: 1;">Push-ups</h1>
      <div style="display: flex; gap: 8px; margin-top: 10px;"><span class="tag">Chest</span><span class="tag">Bodyweight</span></div>
    </div>

    <section class="card" style="padding: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-end;">
        <div><div class="lbl">Best set</div><div class="d" style="font-size: 48px; line-height: 1;">31 <span class="mut" style="font-size: 22px;">reps</span></div></div>
        <div style="text-align: right;"><div class="lbl">Goal</div><div class="d" style="font-size: 28px; line-height: 1.1;">40</div></div>
      </div>
      <div class="bar" style="margin-top: 12px;"><i style="width: 78%;"></i></div>
      <div class="mut" style="font-size: 13px; font-weight: 700; margin-top: 6px;">9 more reps to your goal</div>
    </section>

    <section class="card" style="padding: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;"><h2 class="lbl" style="margin: 0;">Best set · last 8 chest days</h2><span style="color: #C8F135; font-size: 12px; font-weight: 800;">+9</span></div>
      <svg width="318" height="170" viewBox="0 0 318 170" role="img" aria-label="Best push-up set rising from 22 to 31 reps over the last 8 chest days, goal 40" style="display: block; margin-top: 12px;">
        <line x1="0" y1="20" x2="300" y2="20" stroke="#C8F135" stroke-dasharray="5 4" opacity=".6"></line>
        <line x1="0" y1="85" x2="300" y2="85" stroke="#24282D"></line><line x1="0" y1="150" x2="300" y2="150" stroke="#24282D"></line>
        <g fill="#80868D" font-size="11" font-family="Manrope" text-anchor="end"><text x="318" y="24" fill="#C8F135">40</text><text x="318" y="89">30</text><text x="318" y="154">20</text></g>
        <polyline points="10,137 50,124 90,117.5 130,104.5 170,98 210,85 250,85 290,78.5" fill="none" stroke="#C8F135" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></polyline>
        <g fill="#C8F135"><circle cx="10" cy="137" r="3.5"></circle><circle cx="50" cy="124" r="3.5"></circle><circle cx="90" cy="117.5" r="3.5"></circle><circle cx="130" cy="104.5" r="3.5"></circle><circle cx="170" cy="98" r="3.5"></circle><circle cx="210" cy="85" r="3.5"></circle><circle cx="250" cy="85" r="3.5"></circle></g>
        <circle cx="290" cy="78.5" r="6" fill="#C8F135" stroke="#15171A" stroke-width="3"></circle>
        <text x="290" y="66" fill="#F2F3F1" font-size="12" font-weight="800" font-family="Manrope" text-anchor="middle">31</text>
      </svg>
    </section>

    <section class="card">
      <h2 class="lbl" style="margin: 0; padding: 14px 16px 2px;">Every session</h2>
      <div class="li"><span style="flex: 1;"><b>Fri 2 Oct</b><br><span class="mut" style="font-size: 13px;">31 · 26 · 23 · 20</span></span><b>100</b></div>
      <div class="li"><span style="flex: 1;"><b>Fri 25 Sep</b><br><span class="mut" style="font-size: 13px;">30 · 25 · 22 · 20</span></span><b>97</b></div>
      <div class="li"><span style="flex: 1;"><b>Fri 18 Sep</b><br><span class="mut" style="font-size: 13px;">30 · 24 · 21 · 18</span></span><b>93</b></div>
    </section>
  </div>
</div>
</body>
</html>
